<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rocket Run - 2.5D</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            color: white;
            /* STOP MOBILE BROWSER INTERFERENCE */
            touch-action: none; 
            -webkit-user-select: none; 
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        #wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            /* FIX FOR SCRUNCHED MOBILE IFRAME */
            flex: 1; 
            width: 100%;
            max-width: 550px;
            height: 100%;
            background-color: #000000; 
            overflow: hidden;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            z-index: 10;
            transition: opacity 0.3s;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #fff;
            text-align: center;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            margin: 5px 0 20px 0;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            margin: 10px;
            border: 2px solid white;
            background: transparent;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            /* Re-enable touch for buttons just in case */
            touch-action: manipulation; 
        }

        button:hover {
            background: white;
            color: black;
            box-shadow: 0 0 15px white;
        }

        /* HUD */
        #hud {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: right;
            z-index: 5;
            pointer-events: none;
        }

        #score-display {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: 2px;
        }

        #best-hud-display {
            font-size: 1rem;
            color: #aaaaaa;
            margin-top: 2px;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.3);
        }

        #coin-hud-display {
            font-size: 1.2rem;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            margin-bottom: 5px;
            font-weight: 700;
        }

        /* Shop UI */
        #shop-items {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
            width: 90%;
            max-width: 400px;
            max-height: 50vh;
            overflow-y: auto;
            padding-bottom: 10px;
        }

        .shop-item {
            border: 2px solid #555;
            padding: 12px 5px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            touch-action: manipulation;
            font-size: 0.95rem;
            transition: border-color 0.1s ease;
        }

        .shop-item.active {
            border-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        .shop-item.locked {
            opacity: 0.6;
        }

        .shop-item.sequence-locked {
            opacity: 0.3;
        }

        .color-preview {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            margin: 0 auto 8px auto;
        }

        .chrome-preview {
            background: linear-gradient(135deg, #777 0%, #fff 50%, #555 100%);
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud" class="hidden">
            <div id="coin-hud-display">Coins: 0</div>
            <div id="score-display">0</div>
            <div id="best-hud-display">Best: 0</div>
        </div>

        <div id="start-screen" class="screen">
            <h1>Rocket Run</h1>
            <p>Best Score: <span id="best-score-display">0</span></p>
            <p style="color: #00ffff; text-shadow: 0 0 5px #00ffff;">Total Coins: <span id="total-coins-display">0</span></p>
            <button id="start-btn">Play</button>
            <button id="shop-btn-start">Shop</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: #ff4444; text-shadow: 0 0 10px #ff4444;">GAME OVER</h1>
            <p>Score: <span id="final-score">0</span></p>
            <p style="color: #aaaaaa; font-size: 1rem; margin-top: -15px;">Best: <span id="game-over-best-score">0</span></p>
            <button id="restart-btn">Play Again</button>
            <button id="shop-btn-end">Shop</button>
        </div>

        <div id="shop-screen" class="screen hidden">
            <h1>HANGAR</h1>
            <p style="color: #00ffff; text-shadow: 0 0 5px #00ffff;">Your Coins: <span id="shop-coins">0</span></p>
            <div style="margin: 10px 0;">
                <canvas id="rocketPreviewCanvas" width="100" height="150"></canvas>
            </div>
            <div id="shop-items"></div>
            <button id="close-shop-btn" style="margin-top: 20px;">Back</button>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // --- AUDIO MANAGER ---
    const sfx = {
        bgm: new Audio('assets/BackgroundMusic.mp3'),
        btnClick: new Audio('assets/ButtonClick.wav'),
        coinCollect: new Audio('assets/CoinCollect.wav'),
        crash: new Audio('assets/Crash.wav'),
        shieldShatter: new Audio('assets/ShieldShatter.wav'),
        start: new Audio('assets/Start.wav'),
        warp: new Audio('assets/Warp.wav')
    };

    sfx.bgm.loop = true;
    sfx.bgm.volume = 0.4; 
    let bgmStarted = false;

    // Helper for single sound triggers
    function playSound(audioNode) {
        audioNode.currentTime = 0; 
        audioNode.play().catch(e => console.log("Audio play failed:", e));
    }

    // Helper for overlapping rapid triggers (like coins)
    function playClone(audioNode) {
        let clone = audioNode.cloneNode();
        clone.play().catch(e => console.log("Audio clone play failed:", e));
    }

    // Helper to ensure BGM starts exactly once upon user interaction
    function ensureBGM() {
        if (!bgmStarted) {
            sfx.bgm.play().catch(e => console.log("BGM playback blocked by browser rules.", e));
            bgmStarted = true;
        }
    }

    // Context and DOM setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const previewCanvas = document.getElementById('rocketPreviewCanvas');
    const previewCtx = previewCanvas.getContext('2d');
    const container = document.getElementById('game-container');

    const screens = {
        start: document.getElementById('start-screen'),
        gameover: document.getElementById('game-over-screen'),
        shop: document.getElementById('shop-screen')
    };
    
    const hud = document.getElementById('hud');
    const scoreDisplay = document.getElementById('score-display');
    const bestHudDisplay = document.getElementById('best-hud-display');
    const coinHudDisplay = document.getElementById('coin-hud-display');
    const finalScoreDisplay = document.getElementById('final-score');
    const bestScoreDisplay = document.getElementById('best-score-display');
    const gameOverBestScoreDisplay = document.getElementById('game-over-best-score');
    const totalCoinsDisplay = document.getElementById('total-coins-display');
    const shopCoinsDisplay = document.getElementById('shop-coins');
    const shopItemsContainer = document.getElementById('shop-items');

    // Safe color shading
    function shadeColor(color, percent) {
        if (!color || !color.startsWith('#') || color.length !== 7) return '#ffffff';
        let R = parseInt(color.substring(1,3),16);
        let G = parseInt(color.substring(3,5),16);
        let B = parseInt(color.substring(5,7),16);

        R = parseInt(R * (100 + percent) / 100);
        G = parseInt(G * (100 + percent) / 100);
        B = parseInt(B * (100 + percent) / 100);

        R = (R<255)?R:((R<0)?0:255);  
        G = (G<255)?G:((G<0)?0:255);  
        B = (B<255)?B:((B<0)?0:255);  

        let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
        let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
        let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));

        return "#"+RR+GG+BB;
    }

    // State Variables
    let gameState = 'START'; 
    let previousGameState = 'START';
    let score = 0;
    let frameCount = 0;
    
    // Core pacing
    let currentSpeedMultiplier = 1;
    let displaySpeed = 1; 
    
    // Warp Drive & Gold Coin mechanics
    let runCoinsCollected = 0;
    let goldCoinQueued = false;
    let boostActive = false;
    let boostTimer = 0;
    
    // Shield Mechanics
    let shieldActive = false;
    let shieldTimer = 0;
    let hasOneTimeShield = localStorage.getItem('rocketOneTimeShield') === 'true';
    let oneTimeShieldActive = false;

    let bestScore = parseInt(localStorage.getItem('rocketHighScore')) || 0;
    let totalCoins = parseInt(localStorage.getItem('rocketCoins')) || 0;
    
    const shopColors = [
        { id: 'white', name: 'Standard', color: '#ffffff', price: 0 },
        { id: 'red', name: 'Crimson', color: '#ff3333', price: 50 },
        { id: 'green', name: 'Toxic', color: '#33ff33', price: 100 },
        { id: 'gold', name: 'Royal', color: '#ffd700', price: 250 },
        { id: 'purple', name: 'Nebula', color: '#cc33ff', price: 500 },
        { id: 'chrome', name: 'Chrome', color: '#eeeeee', price: 1000 }
    ];
    
    let unlockedColors = ['white'];
    try {
        const savedColors = localStorage.getItem('rocketUnlockedColors');
        if (savedColors) unlockedColors = JSON.parse(savedColors);
    } catch (e) {
        console.error("Local storage error:", e);
    }
    
    let equippedColorId = localStorage.getItem('rocketEquippedColor') || 'white';

    // Update Initial Displays
    bestScoreDisplay.innerText = bestScore;
    bestHudDisplay.innerText = "Best: " + bestScore;
    totalCoinsDisplay.innerText = totalCoins;
    gameOverBestScoreDisplay.innerText = bestScore;

    // Entities
    const rocket = {
        w: 36,
        h: 60,
        x: container.clientWidth / 2 || 200,
        y: container.clientHeight - 120 || 400,
        targetX: container.clientWidth / 2 || 200,
        angle: 0,
        trail: []
    };

    let stars = [];
    let planets = [];
    let coins = [];
    let popups = []; 
    let particles = []; 

    const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };

    // Canvas Sizing
    function resize() {
        canvas.width = container.clientWidth || window.innerWidth;
        canvas.height = container.clientHeight || window.innerHeight;
        if (rocket && rocket.y > canvas.height - 100) {
            rocket.y = canvas.height - 120;
        }
    }
    window.addEventListener('resize', () => {
        setTimeout(resize, 50);
    });
    resize();

    // Inputs
    window.addEventListener('keydown', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        if ((e.code === 'Space' || e.key === ' ') && gameState !== 'PLAYING') {
            e.preventDefault(); 
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                ensureBGM();
                playSound(sfx.btnClick);
                startGame();
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    function updateTargetX(clientX) {
        if (gameState !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        rocket.targetX = clientX - rect.left;
    }

    window.addEventListener('mousemove', (e) => updateTargetX(e.clientX));
    
    window.addEventListener('touchstart', (e) => {
        if(gameState === 'PLAYING') {
            if(e.target === canvas) e.preventDefault();
            if(e.touches && e.touches.length > 0) {
                updateTargetX(e.touches[0].clientX);
            }
        }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if(gameState === 'PLAYING') {
            if(e.target === canvas) e.preventDefault();
            if(e.touches && e.touches.length > 0) {
                updateTargetX(e.touches[0].clientX);
            }
        }
    }, { passive: false });

    // Buttons
    document.getElementById('start-btn').addEventListener('click', () => { ensureBGM(); playSound(sfx.btnClick); startGame(); });
    document.getElementById('restart-btn').addEventListener('click', () => { ensureBGM(); playSound(sfx.btnClick); startGame(); });
    document.getElementById('shop-btn-start').addEventListener('click', () => { ensureBGM(); playSound(sfx.btnClick); openShop(); });
    document.getElementById('shop-btn-end').addEventListener('click', () => { ensureBGM(); playSound(sfx.btnClick); openShop(); });
    
    document.getElementById('close-shop-btn').addEventListener('click', () => {
        ensureBGM();
        playSound(sfx.btnClick);
        screens.shop.classList.add('hidden');
        if (previousGameState === 'START') {
            screens.start.classList.remove('hidden');
            gameState = 'START';
        } else {
            screens.gameover.classList.remove('hidden');
            gameState = 'GAMEOVER';
        }
    });

    function initStars() {
        stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                baseSpeed: Math.random() * 3 + 1
            });
        }
    }

    function startGame() {
        ensureBGM(); // Safety catch
        playSound(sfx.start);

        score = 0;
        frameCount = 0;
        currentSpeedMultiplier = 1;
        displaySpeed = 1;
        runCoinsCollected = 0;
        goldCoinQueued = false;
        
        boostActive = false;
        boostTimer = 0;
        shieldActive = false;
        shieldTimer = 0;
        
        // Consume 1-time shield if they bought it
        if (hasOneTimeShield) {
            oneTimeShieldActive = true;
            hasOneTimeShield = false;
            localStorage.setItem('rocketOneTimeShield', 'false');
        } else {
            oneTimeShieldActive = false;
        }

        planets = [];
        coins = [];
        popups = [];
        particles = [];
        rocket.trail = [];
        
        rocket.x = canvas.width / 2;
        rocket.targetX = canvas.width / 2;
        rocket.y = canvas.height - 120;
        rocket.angle = 0;
        
        gameState = 'PLAYING';
        
        screens.start.classList.add('hidden');
        screens.gameover.classList.add('hidden');
        screens.shop.classList.add('hidden');
        
        hud.classList.remove('hidden');
        bestHudDisplay.innerText = "Best: " + bestScore;
        updateHUD();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        
        // Play Crash (BGM keeps playing uninterrupted)
        playSound(sfx.crash);

        boostActive = false;
        shieldActive = false;
        oneTimeShieldActive = false;
        displaySpeed = 1;
        
        if (score > bestScore) {
            bestScore = Math.floor(score);
            localStorage.setItem('rocketHighScore', bestScore);
        }
        localStorage.setItem('rocketCoins', totalCoins);
        
        hud.classList.add('hidden');
        screens.gameover.classList.remove('hidden');
        finalScoreDisplay.innerText = Math.floor(score);
        bestScoreDisplay.innerText = bestScore;
        gameOverBestScoreDisplay.innerText = bestScore;
        totalCoinsDisplay.innerText = totalCoins;
    }

    function update() {
        frameCount++;
        currentSpeedMultiplier += 0.001; 
        
        if (boostActive) {
            displaySpeed = currentSpeedMultiplier * 3.5;
            boostTimer--;
            if (boostTimer <= 0) boostActive = false;
        } else {
            displaySpeed = currentSpeedMultiplier;
        }

        if (shieldActive) {
            shieldTimer--;
            if (shieldTimer <= 0) shieldActive = false;
        }

        score += displaySpeed * 0.1;
        
        updateRocket();
        updateStars();
        handleSpawns();
        updatePlanets();
        updateCoins();
        updatePopups();
        updateParticles();
        updateHUD();
    }

    function updateMenuBackground() {
        frameCount++;
        updateStars();

        if (frameCount % 80 === 0) {
            const type = Math.floor(Math.random() * 3);
            const radius = Math.random() * 30 + 20;
            const details = [];
            
            if (type === 0) {
                for (let c = 0; c < 3; c++) {
                    details.push({
                        cx: (Math.random() - 0.5) * radius * 0.9,
                        cy: (Math.random() - 0.5) * radius * 0.9,
                        r: Math.max(0.1, Math.random() * radius * 0.2 + radius * 0.1)
                    });
                }
            }

            planets.push({
                x: Math.random() * canvas.width,
                y: -60,
                radius: radius,
                baseSpeed: Math.random() * 2 + 1, 
                type: type,
                details: details
            });
        }

        for (let i = planets.length - 1; i >= 0; i--) {
            let p = planets[i];
            p.y += p.baseSpeed * displaySpeed;
            if (p.y > canvas.height + p.radius) {
                planets.splice(i, 1);
            }
        }
        
        for (let i = coins.length - 1; i >= 0; i--) {
            coins[i].y += coins[i].baseSpeed * displaySpeed;
            if (coins[i].y > canvas.height + coins[i].radius) coins.splice(i, 1);
        }

        for (let i = popups.length - 1; i >= 0; i--) {
            popups[i].y -= 1;
            popups[i].life--;
            popups[i].alpha = Math.max(0, popups[i].life / 60);
            if (popups[i].life <= 0) popups.splice(i, 1);
        }
    }

    function updateRocket() {
        const moveSpeed = 15; 
        if (keys.ArrowLeft || keys.a) rocket.targetX -= moveSpeed;
        if (keys.ArrowRight || keys.d) rocket.targetX += moveSpeed;

        rocket.targetX = Math.max(rocket.w/2, Math.min(canvas.width - rocket.w/2, rocket.targetX));

        const oldX = rocket.x;
        const dx = rocket.targetX - rocket.x;
        rocket.x += dx * 0.2; 
        
        rocket.angle = dx * 0.004;
        rocket.angle = Math.max(-0.15, Math.min(0.15, rocket.angle));

        const distMoved = Math.abs(rocket.x - oldX);
        const steps = Math.min(20, Math.max(1, Math.ceil(distMoved / 3)));
        
        for (let i = 1; i <= steps; i++) {
            const lerpX = oldX + (rocket.x - oldX) * (i / steps);
            rocket.trail.push({ 
                x: lerpX, 
                y: rocket.y + rocket.h/2 - 5, 
                life: 1.0 
            });
        }

        rocket.trail.forEach(t => {
            t.y += 3 * displaySpeed;
            t.life -= boostActive ? 0.03 : 0.05; 
        });
        
        rocket.trail = rocket.trail.filter(t => t.life > 0.01);
    }

    function updateStars() {
        stars.forEach(star => {
            star.y += star.baseSpeed * displaySpeed;
            if (star.y > canvas.height) {
                star.y = 0;
                star.x = Math.random() * canvas.width;
            }
        });
    }

    function handleSpawns() {
        const spawnRate = Math.max(10, 55 - Math.floor(displaySpeed * 15));
        
        if (frameCount % spawnRate === 0) {
            const type = Math.floor(Math.random() * 3);
            const radius = Math.random() * 30 + 20;
            const details = [];
            
            if (type === 0) {
                for (let c = 0; c < 3; c++) {
                    details.push({
                        cx: (Math.random() - 0.5) * radius * 0.9,
                        cy: (Math.random() - 0.5) * radius * 0.9,
                        r: Math.max(0.1, Math.random() * radius * 0.2 + radius * 0.1)
                    });
                }
            }

            planets.push({
                x: Math.random() * canvas.width,
                y: -60,
                radius: radius,
                baseSpeed: Math.random() * 4 + 4,
                type: type,
                details: details
            });
        }

        if (Math.random() < 0.015) {
            let isGold = false;
            if (goldCoinQueued) {
                isGold = true;
                goldCoinQueued = false;
            }

            coins.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -30,
                radius: 12,
                baseSpeed: 4,
                isGold: isGold
            });
        }
    }

    function updatePlanets() {
        for (let i = planets.length - 1; i >= 0; i--) {
            let p = planets[i];
            p.y += p.baseSpeed * displaySpeed;

            const dist = Math.hypot(p.x - rocket.x, p.y - rocket.y);
            if (dist < p.radius + rocket.w / 2 - 5) {
                // Check Warp shield first
                if (shieldActive) { 
                    score += 50; 
                    planets.splice(i, 1);
                } 
                // Check 1-time consumable shield next
                else if (oneTimeShieldActive) {
                    oneTimeShieldActive = false; // Break it
                    planets.splice(i, 1);
                    
                    playSound(sfx.shieldShatter); // SHIELD BREAK AUDIO
                    
                    for(let k = 0; k < 15; k++) {
                        let angle = Math.random() * Math.PI * 2;
                        let speed = Math.random() * 5 + 2;
                        particles.push({
                            x: rocket.x,
                            y: rocket.y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            life: 20 + Math.random() * 15,
                            maxLife: 35,
                            color: '#00ffff'
                        });
                    }
                }
                // No shield, game over
                else {
                    gameOver();
                }
            } else if (p.y > canvas.height + p.radius) {
                planets.splice(i, 1);
            }
        }
    }

    function updateCoins() {
        for (let i = coins.length - 1; i >= 0; i--) {
            let c = coins[i];
            c.y += c.baseSpeed * displaySpeed;

            const dist = Math.hypot(c.x - rocket.x, c.y - rocket.y);
            
            if (dist < c.radius + rocket.w / 2 + 10) { 
                totalCoins++;
                runCoinsCollected++;
                localStorage.setItem('rocketCoins', totalCoins);
                
                if (c.isGold) {
                    boostActive = true;
                    boostTimer = 180; 
                    shieldActive = true;
                    shieldTimer = 240; 
                    playSound(sfx.warp); // WARP AUDIO
                } else {
                    popups.push({ x: c.x, y: c.y, life: 60, alpha: 1.0, text: '+1', color: '#00ffff' });
                    playClone(sfx.coinCollect); // CLONED COIN AUDIO FOR RAPID COLLECTS
                    if (runCoinsCollected % 10 === 9) { 
                        goldCoinQueued = true;
                    }
                }

                coins.splice(i, 1);
                continue;
            }

            if (c.y > canvas.height + c.radius) {
                coins.splice(i, 1);
            }
        }
    }

    function updatePopups() {
        for (let i = popups.length - 1; i >= 0; i--) {
            let p = popups[i];
            p.y -= 1;
            p.life--;
            p.alpha = Math.max(0, p.life / 60);
            if (p.life <= 0) {
                popups.splice(i, 1);
            }
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function updateHUD() {
        scoreDisplay.innerText = Math.floor(score);
        coinHudDisplay.innerText = `Coins: ${totalCoins}`;
    }

    function draw() {
        drawStars();
        drawPlanets();
        drawCoins();
        drawTrail(ctx);
        // Visual aura applied if EITHER shield is currently active
        drawRocket(ctx, rocket.x, rocket.y, rocket.w, rocket.h, equippedColorId, rocket.angle, shieldActive || oneTimeShieldActive);
        drawParticles();
        drawPopups();
    }

    function drawMenuBackground() {
        drawStars();
        drawPlanets();
        drawCoins();
        drawPopups();
    }

    function drawStars() {
        ctx.strokeStyle = 'white';
        ctx.fillStyle = 'white';
        stars.forEach(star => {
            ctx.globalAlpha = Math.random() * 0.5 + 0.5;
            if (boostActive && gameState === 'PLAYING') {
                ctx.beginPath();
                ctx.moveTo(star.x, star.y);
                ctx.lineTo(star.x, star.y - (star.baseSpeed * displaySpeed * 1.5));
                ctx.lineWidth = star.size;
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(star.x, star.y, Math.max(0.1, star.size), 0, Math.PI * 2);
                ctx.fill();
            }
        });
        ctx.globalAlpha = 1.0;
    }

    function drawPlanets() {
        planets.forEach(p => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(0.1, p.radius), 0, Math.PI * 2);
            ctx.clip();

            const grad = ctx.createRadialGradient(
                p.x - p.radius * 0.3, p.y - p.radius * 0.3, Math.max(0.1, p.radius * 0.1),
                p.x, p.y, Math.max(0.1, p.radius)
            );

            if (p.type === 0) { 
                grad.addColorStop(0, '#e0e0e0');
                grad.addColorStop(0.5, '#999999');
                grad.addColorStop(1, '#333333');
                ctx.fillStyle = grad;
                ctx.fillRect(p.x - p.radius, p.y - p.radius, p.radius * 2, p.radius * 2);

                p.details.forEach(c => {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                    ctx.beginPath();
                    ctx.arc(p.x + c.cx, p.y + c.cy, Math.max(0.1, c.r), 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });

            } else if (p.type === 1) { 
                grad.addColorStop(0, '#ffaa55');
                grad.addColorStop(0.5, '#cc5500');
                grad.addColorStop(1, '#552200');
                ctx.fillStyle = grad;
                ctx.fillRect(p.x - p.radius, p.y - p.radius, p.radius * 2, p.radius * 2);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.fillRect(p.x - p.radius, p.y - p.radius * 0.3, p.radius * 2, p.radius * 0.3);
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(p.x - p.radius, p.y + p.radius * 0.2, p.radius * 2, p.radius * 0.4);

            } else if (p.type === 2) { 
                grad.addColorStop(0, '#66ccff');
                grad.addColorStop(0.5, '#0066cc');
                grad.addColorStop(1, '#001155');
                ctx.fillStyle = grad;
                ctx.fillRect(p.x - p.radius, p.y - p.radius, p.radius * 2, p.radius * 2);

                ctx.translate(p.x, p.y);
                ctx.rotate(Math.PI / 8); 
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.fillRect(-p.radius, -p.radius * 0.4, p.radius * 2, p.radius * 0.3);
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                ctx.fillRect(-p.radius, p.radius * 0.1, p.radius * 2, p.radius * 0.4);
                
                ctx.rotate(-Math.PI / 8);
                ctx.translate(-p.x, -p.y);
            }

            ctx.restore();
        });
    }

    function drawCoins() {
        coins.forEach(c => {
            let glowColor = c.isGold ? '#ffd700' : '#00ffff';
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = glowColor;
            ctx.fillStyle = '#ffffff';
            
            ctx.beginPath();
            ctx.arc(c.x, c.y, Math.max(0.1, c.radius), 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = glowColor;
            ctx.beginPath();
            ctx.arc(c.x, c.y, Math.max(0.1, c.radius * 0.6), 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
        });
    }

    function drawPopups() {
        ctx.font = 'bold 20px "Orbitron", sans-serif';
        ctx.textAlign = 'center';
        
        popups.forEach(p => {
            ctx.shadowBlur = 5;
            ctx.shadowColor = p.color || '#00ffff';
            
            let hex = p.color || '#00ffff';
            let r = parseInt(hex.slice(1,3), 16);
            let g = parseInt(hex.slice(3,5), 16);
            let b = parseInt(hex.slice(5,7), 16);
            
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${p.alpha})`;
            ctx.fillText(p.text, p.x, p.y);
        });
        
        ctx.shadowBlur = 0;
        ctx.textAlign = 'left';
    }

    function drawParticles() {
        ctx.lineWidth = 3;
        particles.forEach(p => {
            ctx.strokeStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx * 1.5, p.y - p.vy * 1.5);
            ctx.stroke();
        });
        ctx.globalAlpha = 1.0;
    }

    function drawTrail(context) {
        rocket.trail.forEach(t => {
            let colorOuter = boostActive ? `rgba(0, 200, 255, ${t.life * 0.5})` : `rgba(255, 100, 0, ${t.life * 0.5})`;
            let colorInner = boostActive ? `rgba(255, 255, 255, ${t.life * 0.8})` : `rgba(255, 255, 0, ${t.life * 0.8})`;
            let sizeMult = boostActive ? 1.5 : 1;

            context.fillStyle = colorOuter;
            context.beginPath();
            context.arc(t.x, t.y, Math.max(0.1, (rocket.w / 2.5) * t.life * sizeMult), 0, Math.PI * 2);
            context.fill();
            
            context.fillStyle = colorInner;
            context.beginPath();
            context.arc(t.x, t.y, Math.max(0.1, (rocket.w / 5) * t.life * sizeMult), 0, Math.PI * 2);
            context.fill();
        });
    }

    function getEquippedColorData(colorId) {
        return shopColors.find(color => color.id === colorId) || shopColors[0];
    }

    function drawRocket(context, x, y, w, h, colorId, angle, isShielded) {
        context.save();
        context.translate(x, y);
        context.rotate(angle);

        if (isShielded) {
            let pulse = Math.sin(Date.now() / 100) * 5;
            context.beginPath();
            context.arc(0, 0, w * 1.2 + pulse, 0, Math.PI * 2);
            context.fillStyle = 'rgba(0, 255, 255, 0.2)';
            context.fill();
            context.lineWidth = 3;
            context.strokeStyle = 'rgba(0, 255, 255, 0.8)';
            context.stroke();
        }

        const colorData = getEquippedColorData(colorId);
        const isChrome = colorId === 'chrome';
        const color = isChrome ? '#dddddd' : colorData.color;

        context.fillStyle = isChrome ? '#888888' : shadeColor(color, -30);
        context.beginPath();
        context.moveTo(-w/4, h/4);
        context.lineTo(-w/1.8, h/2);
        context.lineTo(-w/4, h/2.5);
        context.fill();

        context.fillStyle = isChrome ? '#555555' : shadeColor(color, -50); 
        context.beginPath();
        context.moveTo(w/4, h/4);
        context.lineTo(w/1.8, h/2);
        context.lineTo(w/4, h/2.5);
        context.fill();

        const bodyGrad = context.createLinearGradient(-w/2, 0, w/2, 0);
        
        if (isChrome) {
            let time = Date.now() / 400;
            let shift = Math.sin(time) * 0.5 + 0.5; 
            bodyGrad.addColorStop(0, '#555555');
            bodyGrad.addColorStop(Math.min(1, Math.max(0, shift - 0.2)), '#999999');
            bodyGrad.addColorStop(shift, '#ffffff');
            bodyGrad.addColorStop(Math.min(1, Math.max(0, shift + 0.2)), '#999999');
            bodyGrad.addColorStop(1, '#555555');
        } else {
            bodyGrad.addColorStop(0, shadeColor(color, -40));
            bodyGrad.addColorStop(0.5, color);
            bodyGrad.addColorStop(1, shadeColor(color, -60));
        }
        
        context.fillStyle = bodyGrad;
        context.beginPath();
        context.moveTo(0, -h/2); 
        context.quadraticCurveTo(w/2.5, -h/4, w/3, h/2);
        context.lineTo(-w/3, h/2);
        context.quadraticCurveTo(-w/2.5, -h/4, 0, -h/2);
        context.fill();

        const glassGrad = context.createRadialGradient(0, -h/8, 1, 0, -h/8, w/4);
        glassGrad.addColorStop(0, '#ffffff');
        glassGrad.addColorStop(0.5, '#44aaff');
        glassGrad.addColorStop(1, '#002244');
        
        context.fillStyle = glassGrad;
        context.beginPath();
        context.ellipse(0, -h/8, Math.max(0.1, w/5), Math.max(0.1, h/8), 0, 0, Math.PI * 2);
        context.fill();

        context.restore();
    }

    function mainLoop() {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'PLAYING') {
            update();
            draw();
        } else {
            updateMenuBackground();
            drawMenuBackground();
            
            if (gameState === 'SHOP') {
                drawPreview();
            }
        }
        
        requestAnimationFrame(mainLoop);
    }

    function openShop() {
        previousGameState = gameState;
        gameState = 'SHOP';
        screens.start.classList.add('hidden');
        screens.gameover.classList.add('hidden');
        screens.shop.classList.remove('hidden');
        shopCoinsDisplay.innerText = totalCoins;
        
        renderShopItems();
    }

    function drawPreview() {
        if (!previewCtx) return;
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        
        let rx = previewCanvas.width / 2;
        let ry = previewCanvas.height / 2 - 15;
        
        let time = Date.now();
        let subtleFlicker = (Math.sin(time / 150) + 1) / 2; 
        
        let outerLength = 45 + subtleFlicker * 3;
        let outerWidth = 12;
        let innerLength = 28 + subtleFlicker * 2;
        let innerWidth = 6;

        previewCtx.fillStyle = `rgba(255, 100, 0, ${0.85 + subtleFlicker * 0.15})`;
        previewCtx.beginPath();
        previewCtx.moveTo(rx - outerWidth, ry + 36);
        previewCtx.lineTo(rx + outerWidth, ry + 36);
        previewCtx.lineTo(rx, ry + 36 + outerLength);
        previewCtx.closePath();
        previewCtx.fill();
        
        previewCtx.fillStyle = `rgba(255, 255, 0, ${0.9 + subtleFlicker * 0.1})`;
        previewCtx.beginPath();
        previewCtx.moveTo(rx - innerWidth, ry + 36);
        previewCtx.lineTo(rx + innerWidth, ry + 36);
        previewCtx.lineTo(rx, ry + 36 + innerLength);
        previewCtx.closePath();
        previewCtx.fill();

        drawRocket(previewCtx, rx, ry, 45, 75, equippedColorId, 0, false);
    }

    function renderShopItems() {
        shopItemsContainer.innerHTML = '';
        
        // --- 1. RENDER SHIELD CONSUMABLE ---
        const shieldDiv = document.createElement('div');
        shieldDiv.className = `shop-item ${hasOneTimeShield ? 'active' : ''}`;
        shieldDiv.style.gridColumn = 'span 2'; 
        
        let shieldText = hasOneTimeShield ? 'Equipped (Next Run)' : '50 Coins';
        
        shieldDiv.innerHTML = `
            <div style="margin: 0 auto 8px auto; height: 35px; width: 35px;">
                <canvas id="shield-icon-canvas" width="35" height="35"></canvas>
            </div>
            <strong>Deflector Shield</strong><br>
            ${shieldText}
        `;
        
        shieldDiv.addEventListener('click', () => {
            ensureBGM();
            playSound(sfx.btnClick);
            if (!hasOneTimeShield && totalCoins >= 50) {
                totalCoins -= 50;
                localStorage.setItem('rocketCoins', totalCoins);
                hasOneTimeShield = true;
                localStorage.setItem('rocketOneTimeShield', 'true');
                
                shopCoinsDisplay.innerText = totalCoins;
                totalCoinsDisplay.innerText = totalCoins;
                renderShopItems();
            } else if (!hasOneTimeShield) {
                shieldDiv.style.borderColor = 'red';
                setTimeout(() => shieldDiv.style.borderColor = '', 300);
            }
        });
        shopItemsContainer.appendChild(shieldDiv);

        const sCanvas = document.getElementById('shield-icon-canvas');
        if (sCanvas) {
            const sCtx = sCanvas.getContext('2d');
            sCtx.beginPath();
            sCtx.moveTo(17.5, 3);
            sCtx.lineTo(32, 8);
            sCtx.bezierCurveTo(32, 22, 25, 32, 17.5, 34);
            sCtx.bezierCurveTo(10, 32, 3, 22, 3, 8);
            sCtx.closePath();
            
            sCtx.fillStyle = 'rgba(0, 255, 255, 0.2)';
            sCtx.fill();
            sCtx.lineWidth = 2;
            sCtx.strokeStyle = '#00ffff';
            sCtx.stroke();
        }

        // --- 2. RENDER COLOR UNLOCKS ---
        shopColors.forEach((item, index) => {
            const isUnlocked = unlockedColors.includes(item.id);
            const isEquipped = equippedColorId === item.id;
            const isChrome = item.id === 'chrome';
            
            const isPurchasable = isUnlocked || index === 0 || unlockedColors.includes(shopColors[index - 1].id);
            
            const div = document.createElement('div');
            
            let classNames = `shop-item ${isEquipped ? 'active' : ''}`;
            if (!isUnlocked) {
                classNames += isPurchasable ? ' locked' : ' sequence-locked';
            }
            div.className = classNames;
            
            let previewStyle = isChrome ? 'class="color-preview chrome-preview"' : `class="color-preview" style="background-color: ${item.color};"`;

            let priceText = '';
            if (isEquipped) {
                priceText = 'Equipped';
            } else if (isUnlocked) {
                priceText = 'Owned';
            } else if (isPurchasable) {
                priceText = `${item.price} Coins`;
            } else {
                priceText = 'Locked';
            }

            div.innerHTML = `
                <div ${previewStyle}></div>
                <strong>${item.name}</strong><br>
                ${priceText}
            `;
            
            div.addEventListener('click', () => {
                ensureBGM();
                playSound(sfx.btnClick); 
                if (isUnlocked) {
                    equippedColorId = item.id;
                    localStorage.setItem('rocketEquippedColor', equippedColorId);
                    renderShopItems();
                } else if (isPurchasable && totalCoins >= item.price) {
                    totalCoins -= item.price;
                    localStorage.setItem('rocketCoins', totalCoins);
                    unlockedColors.push(item.id);
                    localStorage.setItem('rocketUnlockedColors', JSON.stringify(unlockedColors));
                    
                    equippedColorId = item.id;
                    localStorage.setItem('rocketEquippedColor', equippedColorId);
                    
                    shopCoinsDisplay.innerText = totalCoins;
                    totalCoinsDisplay.innerText = totalCoins;
                    renderShopItems();
                } else {
                    div.style.borderColor = 'red';
                    setTimeout(() => div.style.borderColor = '', 300);
                }
            });
            shopItemsContainer.appendChild(div);
        });
    }

    initStars();
    requestAnimationFrame(mainLoop); 
});
</script>
